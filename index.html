<!-- ======================================================================
            PAGE 4: SENSOR HEALTH
            ====================================================================== -->
      <section id="view-sensor-health" class="view-section">
        <div class="view-header-strip">
          <div class="view-heading-group">
            <h2 class="view-title">Sensor Health &amp; Lifecycle Analytics</h2>
            <p class="view-subtitle" id="sensor-health-subtitle">Continuous acoustic, resistive, and capacitive drift analysis across mesonet transducers.</p>
          </div>
        </div>

        <!-- City Switcher Tabs for Sensor Health -->
        <div class="sensor-health-city-tabs" style="display:flex; gap:10px; margin-bottom:18px; padding-bottom:12px; border-bottom:1px solid var(--border-light);">
          <button class="city-tab-btn active" data-health-station="AWS-JPR-04">
            <span>Jaipur</span>
            <span class="tab-chip critical">Critical</span>
          </button>
          <button class="city-tab-btn" data-health-station="AWS-DEL-07">
            <span>Delhi</span>
            <span class="tab-chip warning">Attention</span>
          </button>
          <button class="city-tab-btn" data-health-station="AWS-CHE-12">
            <span>Chennai</span>
            <span class="tab-chip trusted">Nominal</span>
          </button>
        </div>

        <div class="sensor-health-layout">
          <!-- 3 Sensor Health Cards Grid -->
          <div class="sensor-health-overview-grid" id="health-cards-grid"></div>

          <!-- 90-Day Degradation Timeline Card -->
          <div class="lifecycle-timeline-card">
            <div>
              <h3 style="font-size:1.05rem; font-weight:700" id="health-timeline-title">Temperature Sensor 90-Day Degradation Timeline (AWS-JPR-04)</h3>
              <p style="font-size:0.75rem; color:var(--text-secondary); margin-top:2px" id="health-timeline-desc">
                Demonstrating gradual degradation from baseline stability to the critical spike event.
              </p>
            </div>

            <div class="timeline-horizontal-progression" id="health-timeline-nodes"></div>
          </div>
        </div>
      </section>
