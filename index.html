<!-- ======================================================================
            PAGE 3: INVESTIGATE (INCIDENT INVESTIGATION MODE)
            "Why did the AI classify this reading as an anomaly?"
            ====================================================================== -->
      <section id="view-investigate" class="view-section">
        <div class="view-header-strip">
          <div class="view-heading-group">
            <h2 class="view-title">Incident Investigation Mode</h2>
            <p class="view-subtitle" id="investigate-subtitle">Transparent multi-factor evidence decomposition and event replay for AWS-JPR-04.</p>
          </div>
          <button class="btn-control" onclick="window.AppRouter.switchView('command-center')">
            ← Back to Command Center
          </button>
        </div>

        <!-- City Switcher Tabs for Investigation -->
        <div class="investigate-city-tabs" style="display:flex; gap:10px; margin-bottom:18px; border-bottom:1px solid var(--border-light, #e2e8f0); padding-bottom:10px;">
          <button class="city-tab-btn active" data-investigate-station="AWS-JPR-04">
            <span>Jaipur</span>
            <span class="tab-chip critical" style="background:#FED7D7; color:#C94F4F; padding:2px 7px; border-radius:10px; font-size:11px; font-weight:700; margin-left:4px;">Critical</span>
          </button>
          <button class="city-tab-btn" data-investigate-station="AWS-DEL-07">
            <span>Delhi</span>
            <span class="tab-chip warning" style="background:#FEEBC8; color:#C98A1C; padding:2px 7px; border-radius:10px; font-size:11px; font-weight:700; margin-left:4px;">Attention</span>
          </button>
          <button class="city-tab-btn" data-investigate-station="AWS-CHE-12">
            <span>Chennai</span>
            <span class="tab-chip trusted" style="background:#DCFCE7; color:#2E9B73; padding:2px 7px; border-radius:10px; font-size:11px; font-weight:700; margin-left:4px;">Nominal</span>
          </button>
        </div>

        <div class="investigate-layout">
          <!-- Dynamic Content Loaded by investigate.js -->
          <div id="investigate-dynamic-container">
            <!-- Rendered dynamically -->
          </div>

          <!-- Event Replay Interactive Scrubber -->
          <div class="replay-scrubber-card">
            <div class="replay-header">
              <div style="display:flex; align-items:center; gap:8px">
                <h4 style="font-size:0.95rem; font-weight:700">Incident Event Replay</h4>
                <span style="font-size:0.72rem; color:var(--text-secondary)">Step through the exact sequence of readings</span>
              </div>
              <div class="replay-controls">
                <button id="btn-replay-prev" class="btn-control">◀ Step Back</button>
                <button id="btn-replay-play" class="btn-control btn-brand">▶ Replay Incident</button>
                <button id="btn-replay-next" class="btn-control">Step Forward ▶</button>
              </div>
            </div>

            <div id="replay-steps-container" class="replay-timeline-steps"></div>
            <div id="replay-step-note" style="font-size:0.78rem; color:var(--text-secondary); background:var(--bg-main); padding:8px 12px; border-radius:var(--radius-xs); border:1px solid var(--border-light)"></div>
          </div>

          <!-- Ranked Evidence Stack & Reality Check -->
          <div class="evidence-reality-grid">
            <div class="evidence-stack-card">
              <div style="display:flex; align-items:center; justify-content:space-between">
                <h4 style="font-size:0.95rem; font-weight:700">Why SkyGuard Flagged This (Ranked Evidence)</h4>
                <span style="font-size:0.72rem; color:var(--text-secondary)">Ranked by Contribution</span>
              </div>
              <div id="investigate-evidence-list" class="evidence-list">
                <!-- Injected via investigate.js -->
              </div>
            </div>

            <div class="reality-check-card" id="investigate-reality-card">
              <!-- Injected via investigate.js -->
            </div>
          </div>
        </div>
      </section>
